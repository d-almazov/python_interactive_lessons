<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python-практикум</title>
<meta name="description" content="Інтерактивний практикум Python: умови, цикли for і while, обробка винятків. Завдання з роботами й конвеєрами, код виконується просто в браузері.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;600;700&display=swap">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23191919'/%3E%3Ctext x='16' y='21.5' text-anchor='middle' font-family='Arial,sans-serif' font-weight='700' font-size='15' fill='%23fff'%3EPy%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<script>
  (() => {
    let stored = null;
    try { stored = localStorage.getItem("theme"); } catch (e) {}
    document.documentElement.dataset.theme = stored === "light" || stored === "dark"
      ? stored
      : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  })();
</script>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="logo" href="#start"><span class="logo-mark" aria-hidden="true">Py</span>Python-практикум</a>
  <div class="progress"><span id="progress-text"></span><div class="progress-track"><div id="progress-bar"></div></div><span class="engine" id="engine">● Python 3 у браузері</span></div>
  <button class="theme-toggle" type="button" data-theme-toggle aria-label="Перемкнути тему">
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  </button>
</div></header>
<div class="shell">

</div>
